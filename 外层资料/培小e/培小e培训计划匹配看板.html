<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>培小e·培训计划匹配监控大屏（国网风格）</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;background:#03121f;color:#cfe6f7;position:relative}
.bg{position:fixed;inset:0;z-index:0;background:
 radial-gradient(ellipse at 50% -10%,rgba(24,90,150,.35),transparent 55%),
 radial-gradient(ellipse at 15% 100%,rgba(16,70,120,.25),transparent 50%),
 radial-gradient(ellipse at 85% 100%,rgba(16,70,120,.25),transparent 50%)}
.bg::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(64,158,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(64,158,255,.05) 1px,transparent 1px);background-size:46px 46px}
.wrap{position:relative;z-index:1;min-height:100%;display:flex;flex-direction:column;padding:0 18px 14px}
/* 顶部 */
.hd{flex:0 0 auto;text-align:center;padding:16px 0 6px;position:relative}
.hd h1{font-size:clamp(20px,2.2vw,32px);letter-spacing:6px;font-weight:700;color:#fff;
 text-shadow:0 0 18px rgba(45,140,255,.8),0 0 40px rgba(45,140,255,.4)}
.hd .deco{height:12px;margin:6px auto 0;max-width:1400px;background:
 radial-gradient(ellipse at 50% 0,rgba(64,170,255,.55),transparent 70%);position:relative}
.hd .deco::before{content:"";position:absolute;left:0;right:0;top:5px;height:2px;background:linear-gradient(90deg,transparent,#2f9bff 30%,#7fd4ff 50%,#2f9bff 70%,transparent);box-shadow:0 0 12px #2f9bff}
.hd .sub{font-size:12px;color:#6f9cc0;letter-spacing:2px;margin-top:2px}
.hd .badge{display:inline-block;border:1px solid rgba(64,158,255,.45);color:#7fc3ff;border-radius:3px;font-size:11px;padding:2px 10px;margin:6px 4px 0;letter-spacing:1px;background:rgba(20,60,100,.25)}
.hd .clock{position:absolute;right:8px;top:22px;text-align:right;font-size:12px;color:#7fb6dd;line-height:1.7}
.hd .clock b{font-size:18px;color:#eaf6ff;font-family:Consolas,monospace;letter-spacing:1px}
.hd .logo{position:absolute;left:14px;top:20px;display:flex;align-items:center;gap:8px}
.hd .logo .mark{width:34px;height:34px;border-radius:50%;border:2px solid #2f9bff;display:flex;align-items:center;justify-content:center;color:#7fd4ff;font-size:11px;font-weight:700;box-shadow:0 0 12px rgba(47,155,255,.6)}
.hd .logo span{font-size:12px;color:#8db8dc;letter-spacing:2px;line-height:1.5;text-align:left}
/* KPI */
.kpis{flex:0 0 auto;display:grid;grid-template-columns:repeat(9,1fr);gap:10px;margin:10px 0}
.kpi{position:relative;background:linear-gradient(180deg,rgba(14,44,76,.85),rgba(8,26,46,.85));border:1px solid rgba(64,158,255,.28);padding:12px 4px 10px;text-align:center;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.kpi::before{content:"";position:absolute;top:0;left:12%;right:12%;height:2px;background:linear-gradient(90deg,transparent,var(--kc,#2f9bff),transparent)}
.kv{font-size:clamp(15px,1.55vw,28px);font-weight:700;color:var(--kc,#2f9bff);text-shadow:0 0 14px var(--kg,rgba(47,155,255,.5));font-family:"DIN Alternate",Consolas,"Microsoft YaHei",monospace}
.kl{font-size:11px;color:#7ea6c8;margin-top:5px;letter-spacing:0}
/* 主体三栏 */
.main{flex:1;min-height:520px;display:grid;grid-template-columns:23% 1fr 26%;gap:12px}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;min-width:0}
.panel{flex:1;min-height:220px;min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(10,34,58,.9),rgba(6,20,38,.92));border:1px solid rgba(64,158,255,.22);position:relative}
.panel::before,.panel::after{content:"";position:absolute;width:14px;height:14px;border-color:#3fa2ff;border-style:solid;z-index:2}
.panel::before{top:-1px;left:-1px;border-width:2px 0 0 2px}
.panel::after{bottom:-1px;right:-1px;border-width:0 2px 2px 0}
.pt{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid rgba(64,158,255,.18);background:linear-gradient(90deg,rgba(47,155,255,.16),transparent 65%)}
.pt i{width:4px;height:14px;background:linear-gradient(#7fd4ff,#2f9bff);box-shadow:0 0 8px #2f9bff}
.pt b{font-size:13.5px;color:#dff0ff;letter-spacing:2px;font-weight:600}
.pt em{margin-left:auto;font-style:normal;font-size:10.5px;color:#5d89ad;letter-spacing:1px}
.pc{flex:1;min-height:0;position:relative}
.chart{position:absolute;inset:0}
/* 面板 */
/* 明细表 */
.tbl{position:absolute;inset:0;overflow:auto;padding:0 8px 8px}
.tbl::-webkit-scrollbar{width:4px}.tbl::-webkit-scrollbar-thumb{background:rgba(64,158,255,.35)}
table{width:100%;border-collapse:collapse;font-size:11px}
th{position:sticky;top:0;background:#0d2c4a;color:#7fc3ff;padding:6px 4px;font-weight:600;letter-spacing:1px;border-bottom:1px solid rgba(64,158,255,.35);z-index:1}
td{padding:5px 4px;text-align:center;color:#a9cbe4;border-bottom:1px dashed rgba(64,158,255,.12);white-space:nowrap}
tr:nth-child(even) td{background:rgba(20,60,100,.15)}
td.nm{color:#eaf6ff;font-weight:600}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:2px;border:1px solid}
.t1{color:#67e0a3;border-color:rgba(103,224,163,.5);background:rgba(103,224,163,.08)}
.t2{color:#7fc3ff;border-color:rgba(127,195,255,.5);background:rgba(127,195,255,.08)}
.t3{color:#ffd36e;border-color:rgba(255,211,110,.5);background:rgba(255,211,110,.08)}
.t4{color:#b9c9d9;border-color:rgba(185,201,217,.4);background:rgba(185,201,217,.06)}
/* 底部滚动条 */
.ticker{flex:0 0 auto;margin-top:10px;border:1px solid rgba(64,158,255,.22);background:rgba(8,26,46,.9);display:flex;align-items:center;overflow:hidden;height:34px}
.ticker .tl{flex:0 0 auto;padding:0 14px;height:100%;display:flex;align-items:center;background:linear-gradient(90deg,#134a7c,#0d2c4a);color:#7fd4ff;font-size:12px;letter-spacing:2px;border-right:1px solid rgba(64,158,255,.35)}
.ticker .tv{flex:1;white-space:nowrap;overflow:hidden}
.ticker .tv span{display:inline-block;padding-left:100%;font-size:12px;color:#9fc4de;animation:mv 38s linear infinite}
@keyframes mv{to{transform:translateX(-100%)}}
@media (max-aspect-ratio:13/10){html,body{overflow:auto}.main{grid-template-columns:1fr}.wrap{height:auto}body{padding-bottom:20px}}
</style></head><body>
<div class="bg"></div>
<div class="wrap">
<div class="hd">
 <div class="logo"><div class="mark">PE</div><span>培小e<br>智能培训管理</span></div>
 <h1>培小e · 培训计划管理智能体参培人员匹配监控大屏</h1>
 <div class="deco"></div>
 <div class="clock"><b id="clk">--:--:--</b><br><span id="dt">--</span></div>
</div>

<div class="kpis" id="kpis"></div>

<div class="main">
 <div class="col">
  <div class="panel"><div class="pt"><i></i><b>剔除与顺延原因分布</b><em>规则审计</em></div><div class="pc"><div class="chart" id="cReason"></div></div></div>
 </div>
 <div class="col">
  <div class="panel" style="flex:1.25"><div class="pt"><i></i><b>各期次计划人数 vs 实际匹配人数</b><em>11个期次</em></div><div class="pc"><div class="chart" id="cSession"></div></div></div>
  <div class="panel" style="flex:1.35"><div class="pt"><i></i><b>各单位匹配人次分布</b><em>山东17地市</em></div><div class="pc"><div class="chart" id="cUnit"></div></div></div>
 </div>
 <div class="col">
  <div class="panel"><div class="pt"><i></i><b>匹配明细</b><em>共559人次 · 自动滚动</em></div><div class="pc"><div class="tbl" id="detail"><table><thead><tr><th>班次</th><th>期次</th><th>单位</th><th>姓名</th><th>级别</th><th>匹配说明</th></tr></thead><tbody id="dbody"></tbody></table></div></div></div>
 </div>
</div>

<script>
/* ========= 数据：从后端接口实时取数 =========
   接口：POST {baseUrl}/query，Header Authorization = apiSecret
   取不到数据时回退到内置示例，页面仍可正常展示 */
const API_BASE = "http://127.0.0.1:7529/api/HuangDao/training";
const API_SECRET = "REDACTED_PUBLIC_SAMPLE";
const ADMIN = { account: "admin", credential: "Tcm@950t" };

let KPIS=[];
let SESSIONS=[];
let UNITS=[];
let REASONS=[];
let DETAIL=[];
let LOAD_OK = false;
let LOAD_MSG = "正在从接口加载数据…";

async function apiQuery(table, filters, pageSize, orderBy, orderDirection) {
  const body = { table, data: Object.assign({}, ADMIN), pageNum: 1, pageSize: pageSize || 500 };
  if (filters) body.filters = filters;
  if (orderBy) body.orderBy = orderBy;
  if (orderDirection) body.orderDirection = orderDirection;
  const resp = await fetch(`${API_BASE}/query`, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": API_SECRET },
    body: JSON.stringify(body)
  });
  const json = await resp.json();
  if (json.code !== 0) throw new Error(json.message || "接口返回失败");
  return json.data;
}

/* 取回全部数据（自动翻页） */
async function apiAll(table, pageSize) {
  const size = pageSize || 500;
  let page = 1, rows = [];
  while (true) {
    const body = { table, data: Object.assign({}, ADMIN), pageNum: page, pageSize: size };
    const resp = await fetch(`${API_BASE}/query`, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": API_SECRET },
      body: JSON.stringify(body)
    });
    const json = await resp.json();
    if (json.code !== 0) throw new Error(json.message || "接口返回失败");
    const part = json.data.rows || [];
    rows = rows.concat(part);
    if (part.length < size) break;
    page++;
  }
  return rows;
}

/* 组装看板数据 */
async function loadData() {
  const [leaders, plans, quotas, records] = await Promise.all([
    apiAll("pxe_leader_info"), apiAll("pxe_training_plan"),
    apiAll("pxe_quota_alloc"), apiAll("pxe_train_record")
  ]);
  const year = "2027";
  const yearPlans = plans.filter(p => String(p.planYear) === year);

  const planTotal = yearPlans.reduce((s, p) => s + Number(p.planCount || 0), 0);
  const matched = records.length;
  const matchedPersons = new Set(records.map(r => r.empId)).size;

  // 各期次：计划人数 vs 实际匹配人数
  const recByClass = {};
  records.forEach(r => {
    const key = `${r.className}|${r.sessionNo}`;
    recByClass[key] = (recByClass[key] || 0) + 1;
  });
  SESSIONS = yearPlans.map(p => ({
    n: `${p.className} ${p.sessionNo}`,
    p: Number(p.planCount || 0),
    m: recByClass[`${p.className}|${p.sessionNo}`] || 0
  }));

  // 各单位人员数
  const unitCounter = {};
  leaders.forEach(l => { const u = (l.unitName || "未填").replace("公司", ""); unitCounter[u] = (unitCounter[u] || 0) + 1; });
  UNITS = Object.entries(unitCounter).sort((a, b) => b[1] - a[1]);

  // 各单位匹配人次
  const recCounter = {};
  records.forEach(r => { const u = (r.unitAtTime || "未填").replace("公司", ""); recCounter[u] = (recCounter[u] || 0) + 1; });

  // 剔除与顺延原因：按备注关键词归类
  const reasonCounter = {};
  records.forEach(r => {
    const text = r.remark || "常规匹配";
    const key = text.length > 16 ? text.slice(0, 16) : text;
    reasonCounter[key] = (reasonCounter[key] || 0) + 1;
  });
  REASONS = Object.entries(reasonCounter).sort((a, b) => b[1] - a[1]).slice(0, 11);

  KPIS = [
    { v: String(leaders.length), l: "领导人员总数", c: "#2f9bff" },
    { v: String(planTotal), l: "计划调训人次", c: "#33d17a" },
    { v: String(matched), l: "已匹配人次", c: "#33d17a" },
    { v: planTotal ? (matched * 100 / planTotal).toFixed(1) + "%" : "0%", l: "匹配率", c: "#37c8e8" },
    { v: leaders.length ? (matchedPersons * 100 / leaders.length).toFixed(1) + "%" : "0%", l: "覆盖人员占比", c: "#a96bf2" },
    { v: String(quotas.length), l: "名额分配行数", c: "#ff6b6b" },
    { v: String(yearPlans.length), l: "计划期次", c: "#ff9f43" },
    { v: String(Object.keys(recCounter).length), l: "覆盖单位数", c: "#f7c948" },
    { v: String(records.length), l: "培训记录数", c: "#8fa8bd" }
  ];
  // 明细表：取前 400 条展示
  DETAIL = records.slice(0, 400).map(r => [
    r.className || "", r.sessionNo || "", r.unitAtTime || "", r.empName || "",
    r.cadreLevel || "", (r.remark || r.dataSource || "常规匹配")
  ]);

  LOAD_OK = true;
  LOAD_MSG = `数据来自接口 · 年度 ${year} · ${new Date().toLocaleString()}`;
}


/* ========= 渲染（数据到位后执行） ========= */
function tagCls(t){t=String(t||"");if(t.includes("书记"))return"t3";if(t.includes("学时"))return"t2";if(t.includes("未参培"))return"t1";if(t.includes("春秋检"))return"t2";return"t4";}

function render(){
document.getElementById("kpis").innerHTML=KPIS.map(k=>
 `<div class="kpi" style="--kc:${k.c};--kg:${k.c}55"><div class="kv">${k.v}</div><div class="kl">${k.l}</div></div>`).join("");
document.getElementById("dbody").innerHTML=DETAIL.map(d=>
 `<tr><td>${d[0]}</td><td>${d[1]}</td><td>${d[2]}</td><td class="nm">${d[3]}</td><td>${d[4]}</td><td><span class="tag ${tagCls(d[5])}">${d[5]}</span></td></tr>`).join("");

/* 时钟 */
function tick(){const n=new Date(),p=s=>String(s).padStart(2,"0");
 document.getElementById("clk").textContent=`${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
 document.getElementById("dt").textContent=`${n.getFullYear()}-${p(n.getMonth()+1)}-${p(n.getDate())} 星期${"日一二三四五六"[n.getDay()]}`;}
tick();setInterval(tick,1000);

/* ECharts 公共配置 */
const hasEC=typeof echarts!=="undefined";
const AX={axisLine:{lineStyle:{color:"rgba(64,158,255,.35)"}},axisLabel:{color:"#7ea6c8",fontSize:10},axisTick:{show:false},splitLine:{lineStyle:{color:"rgba(64,158,255,.1)"}}};
const TIP={backgroundColor:"rgba(6,22,40,.95)",borderColor:"rgba(64,158,255,.5)",textStyle:{color:"#cfe6f7",fontSize:12}};
function mk(id,opt){if(!hasEC){document.getElementById(id).innerHTML='<div style="padding:20px;color:#5d89ad;font-size:12px">图表组件加载失败（需联网加载 ECharts），数据详见左侧面板与下方明细。</div>';return;}
 const c=echarts.init(document.getElementById(id));c.setOption(opt);addEventListener("resize",()=>c.resize());}

/* 期次对比 */
mk("cSession",{tooltip:{...TIP,trigger:"axis",axisPointer:{type:"shadow"}},legend:{data:["计划人数","实际匹配"],textStyle:{color:"#7ea6c8",fontSize:11},top:6,itemWidth:12,itemHeight:8},
 grid:{left:8,right:14,top:34,bottom:4,containLabel:true},
 xAxis:{type:"value",...AX},yAxis:{type:"category",inverse:true,data:SESSIONS.map(s=>s.n),axisLine:{lineStyle:{color:"rgba(64,158,255,.35)"}},axisLabel:{color:"#a9cbe4",fontSize:10.5},axisTick:{show:false}},
 series:[
  {name:"计划人数",type:"bar",data:SESSIONS.map(s=>s.p),barWidth:7,itemStyle:{color:"rgba(120,160,200,.35)",borderRadius:4}},
  {name:"实际匹配",type:"bar",data:SESSIONS.map(s=>s.m),barWidth:7,barGap:"-100%",
   itemStyle:{borderRadius:4,color:new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:"#1565c0"},{offset:1,color:"#4fc3f7"}]),shadowColor:"rgba(79,195,247,.6)",shadowBlur:8},
   label:{show:true,position:"right",color:"#7fd4ff",fontSize:10,formatter:p=>`${p.value}/${SESSIONS[p.dataIndex].p}`}}]});

/* 单位分布 */
mk("cUnit",{tooltip:{...TIP,trigger:"axis",axisPointer:{type:"shadow"},formatter:p=>`${p[0].name}公司<br/>匹配人次：<b style="color:#7fd4ff">${p[0].value}</b>`},
 grid:{left:8,right:8,top:26,bottom:2,containLabel:true},
 xAxis:{type:"category",data:UNITS.map(u=>u[0]),...AX,axisLabel:{color:"#a9cbe4",fontSize:10.5,interval:0}},
 yAxis:{type:"value",...AX},
 series:[{type:"bar",data:UNITS.map(u=>u[1]),barWidth:"52%",
  itemStyle:{borderRadius:[4,4,0,0],color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:"#5ee7a0"},{offset:1,color:"rgba(30,140,90,.15)"}]),shadowColor:"rgba(94,231,160,.5)",shadowBlur:8},
  label:{show:true,position:"top",color:"#8fe8b8",fontSize:10}}]});

/* 原因分布 */
mk("cReason",{tooltip:{...TIP,trigger:"axis",axisPointer:{type:"shadow"}},
 grid:{left:4,right:36,top:8,bottom:2,containLabel:true},
 xAxis:{type:"value",show:false},
 yAxis:{type:"category",inverse:true,data:REASONS.map(r=>r[0].length>11?r[0].slice(0,11)+"…":r[0]),axisLine:{lineStyle:{color:"rgba(64,158,255,.35)"}},axisLabel:{color:"#a9cbe4",fontSize:10},axisTick:{show:false}},
 series:[{type:"bar",data:REASONS.map(r=>r[1]),barWidth:9,
  label:{show:true,position:"right",color:"#7fd4ff",fontSize:10},
  itemStyle:{borderRadius:5,color:(p)=>{const cs=["#ff6b6b","#ff9f43","#f7c948","#37c8e8","#2f9bff","#a96bf2","#67e0a3","#8fa8bd","#ff8fab","#5ee7a0","#c084fc"];return cs[p.dataIndex%cs.length];}}}]});

}  /* ===== render 结束 ===== */

/* 明细自动滚动（与数据无关，可先启动） */
(function(){const el=document.getElementById("detail");let d=0;setInterval(()=>{if(!el)return;d+=1;
 if(d>=el.scrollHeight-el.clientHeight){d=0;}el.scrollTop=d;},60);})();

/* ===== 启动：先从接口取数，再渲染 ===== */
loadData().then(render).catch(err=>{
 document.getElementById("kpis").innerHTML=
  `<div class="kpi" style="grid-column:1/-1;--kc:#ff6b6b;--kg:#ff6b6b55">`+
  `<div class="kv" style="font-size:15px">数据加载失败</div>`+
  `<div class="kl">${err.message} · 请确认后端服务已启动（端口 7529）</div></div>`;
});
</script>
</body></html>
